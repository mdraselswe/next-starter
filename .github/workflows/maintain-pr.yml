# A push to a maintain/** branch (the weekly AI maintenance routine, see
# .claude/skills/maintain) opens a pull request and turns on auto-merge.
# CI runs on the push itself, and the PR merges once the "check" job passes.
name: Maintenance PR

on:
  push:
    branches: ["maintain/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main --title "$(printf '%s' "$SUBJECT" | head -n1)" \
              --body "Automated maintenance (.claude/skills/maintain). Merges itself when CI passes."
          fi
          gh pr merge "$BRANCH" --auto --squash
